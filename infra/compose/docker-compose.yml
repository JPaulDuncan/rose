name: rose

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF + everysec is the standard durability/perf compromise for
    # BullMQ. Without AOF a Redis crash loses any scheduled-job state
    # since the last RDB snapshot (default 5 min) — meaning sources
    # silently stop polling and pending jobs vanish. `everysec`
    # caps the loss at 1 second of writes for a small write-throughput
    # cost.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      # Host 11444 → container 11434, to avoid colliding with other local
      # Ollama instances. In-network calls still use http://ollama:11434.
      - "11444:11434"
    environment:
      # Keep up to 3 models warm at once so generation + embedding (and
      # an optional vision model) don't have to evict each other on every
      # request. Tune down if VRAM is tight.
      OLLAMA_MAX_LOADED_MODELS: "3"
      # Allow up to 4 concurrent requests against the same model. Once
      # the worker process is split (perf-roadmap Phase B) multiple
      # worker-llm replicas can saturate this; until then it lets a
      # batched embed call interleave with a streaming generation.
      OLLAMA_NUM_PARALLEL: "4"
      # Hold a model in memory for 24h of idle before unloading. The
      # default of 5 min meant that an idle Ollama would unload after
      # lunch, and the next call after lunch ate a 30s reload. 24h
      # leaves the models hot for any reasonable usage pattern; an
      # operator who wants memory back can SIGHUP the container.
      OLLAMA_KEEP_ALIVE: "24h"
      # Flash attention is a meaningful throughput win on long contexts
      # (synthesis prompts, multi-thread email pages). Cheap to enable;
      # falls back automatically on hardware that doesn't support it.
      OLLAMA_FLASH_ATTENTION: "1"
    # GPU passthrough. The `gpus: all` shortcut is honoured by Docker
    # Compose v2.30+ and Docker Desktop on Windows/macOS. The legacy
    # `deploy.resources.reservations.devices` block is from the Swarm
    # spec and is silently ignored by `docker compose up` on Desktop.
    # Requires `nvidia-container-toolkit` on the host. Comment this
    # line out (or set to 0) when running without an NVIDIA GPU.
    gpus: all

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      # The HMAC secret SearXNG mixes into URL-signing for click
      # tracking. Override in `.env` for production; the bundled
      # default is only safe for local development.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-rose-searxng-dev-secret-change-me}
      # Tells SearXNG which URL to advertise in its own pages.
      # In-cluster callers (the worker) hit http://searxng:8080
      # regardless of this value.
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080/}
    expose:
      - "8080"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Same GPU passthrough as Ollama — nvidia-container-toolkit injects
    # `nvidia-smi` into the container so /api/system/stats can report
    # GPU utilisation, VRAM, and temperature. Without this the System
    # card falls back to "no GPUs detected".
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    gpus: all

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    # Single-process worker — registers every queue handler in one
    # Node process. This is the default; opt into the four split
    # workers below by running `docker compose --profile split up`
    # AND first stopping this service (`docker compose stop worker`)
    # so you don't end up with both the single worker and the split
    # workers competing for the same queues.
    environment:
      WORKER_MODE: all
      # V8 tuning for the data-pipeline workload. The default heap is
      # tuned for a request/response web server; we churn through
      # large LLM prompts and jsdom DOMs and want the GC to be less
      # aggressive about minor collections.
      #   --max-old-space-size: cap heap at 2 GB so a runaway leak
      #       OOM-kills the container instead of paging out the host.
      #   --max-semi-space-size: bump young-gen to 64 MB so transient
      #       jsdom / parser allocations clear in one cycle instead
      #       of being promoted to old-gen and triggering major GCs.
      NODE_OPTIONS: "--max-old-space-size=2048 --max-semi-space-size=64"
    depends_on:
      api:
        condition: service_started
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Split-mode workers (perf-roadmap Phase B). Enable with
  #   docker compose --profile split up
  # which boots the four specialised workers below INSTEAD of the
  # single `worker` service. Each mode subscribes only to the queues
  # in its lane, so a heavy jsdom parse on worker-cpu can't stall the
  # IMAP heartbeat on worker-io. Same Dockerfile across all four —
  # the routing is purely env-driven.
  # ------------------------------------------------------------------
  worker-llm:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    profiles: ["split"]
    environment:
      WORKER_MODE: llm
      # LLM workers buffer big prompts; bump heap.
      NODE_OPTIONS: "--max-old-space-size=2048 --max-semi-space-size=64"
    depends_on:
      api:
        condition: service_started
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-io:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    profiles: ["split"]
    environment:
      WORKER_MODE: io
      NODE_OPTIONS: "--max-old-space-size=1024 --max-semi-space-size=32"
    depends_on:
      api:
        condition: service_started
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-cpu:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    profiles: ["split"]
    environment:
      WORKER_MODE: cpu
      # CPU workers churn through DOMs + embedding buffers; bump
      # young-gen aggressively so the parse/extract churn stays out
      # of major-GC pauses.
      NODE_OPTIONS: "--max-old-space-size=2048 --max-semi-space-size=128"
    depends_on:
      api:
        condition: service_started
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-bg:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    profiles: ["split"]
    environment:
      WORKER_MODE: bg
      NODE_OPTIONS: "--max-old-space-size=512 --max-semi-space-size=32"
    depends_on:
      api:
        condition: service_started
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  mongo_data:
  redis_data:
  ollama_data:
