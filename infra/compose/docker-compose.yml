name: rose

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      # Host 11444 → container 11434, to avoid colliding with other local
      # Ollama instances. In-network calls still use http://ollama:11434.
      - "11444:11434"
    environment:
      # Keep up to 3 models warm at once so generation + embedding (and
      # an optional vision model) don't have to evict each other on every
      # request. Tune down if VRAM is tight.
      OLLAMA_MAX_LOADED_MODELS: "3"
      # Allow concurrent requests to the same model so embedding bursts
      # don't serialise behind one another.
      OLLAMA_NUM_PARALLEL: "2"
      # Hold a model in memory for 30 minutes of idle before unloading.
      OLLAMA_KEEP_ALIVE: "30m"
    # GPU passthrough. The `gpus: all` shortcut is honoured by Docker
    # Compose v2.30+ and Docker Desktop on Windows/macOS. The legacy
    # `deploy.resources.reservations.devices` block is from the Swarm
    # spec and is silently ignored by `docker compose up` on Desktop.
    # Requires `nvidia-container-toolkit` on the host. Comment this
    # line out (or set to 0) when running without an NVIDIA GPU.
    gpus: all

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Same GPU passthrough as Ollama — nvidia-container-toolkit injects
    # `nvidia-smi` into the container so /api/system/stats can report
    # GPU utilisation, VRAM, and temperature. Without this the System
    # card falls back to "no GPUs detected".
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    gpus: all

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_started
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  mongo_data:
  redis_data:
  ollama_data:
